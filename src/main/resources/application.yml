spring:
  application:
    name: backend
  profiles:
    default: local
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  external:
    fire-system-url: ${FIRE_SYSTEM_URL:mock://fire-system}

  # ── 파일 저장소(S3) ──
  # 버킷 이름을 코드에 박지 않는다. dev/prod 버킷을 나누거나 이름이 바뀌어도 코드는 안 건드린다.
  # 실제 값은 서버의 ~/deploy/backend.env 에만 있다(backend.env.example 참고).
  # 로컬은 비어 있어도 된다 — prod 프로파일이 아니면 LocalStorageAdapter가 대신 붙는다.
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}

    # presigned URL 수명. 짧을수록 유출된 URL의 유효 시간이 짧다.
    # 업로드는 사용자가 사진을 고르고 올리는 시간, 조회는 화면이 떠 있는 시간에 맞춘다.
    presign-put-ttl: PT5M
    presign-get-ttl: PT10M

    # ⚠️ presigned PUT 자체에는 크기 제한을 걸 수 없다(SigV4 쿼리 서명에 Content-Length-Range 조건이 없다).
    #    그래서 이 값은 "업로드를 막는 값"이 아니라 "업로드된 뒤 HEAD로 재보고 거부하는 값"이다.
    #    FileUploadService.confirmUpload()가 초과분을 지우고 422를 던진다.
    #
    #    이건 남용 방지의 한 겹일 뿐이다. 발급 API 자체의 상한은 Nginx rate limit
    #    (/api/files/upload-url, IP당 분당 5회)이 잡고, 그래도 쌓인 것은 S3 수명주기 규칙
    #    (uploads/ 접두사 30일 만료)이 치운다. 셋 다 있어야 상한이 생긴다.
    max-upload-bytes: 5242880   # 5MB — 신고 사진 기준

    # 아래 둘은 로컬(prod 아님)에서만 쓰인다. build/ 아래라 .gitignore가 이미 걸러준다.
    local-dir: build/local-storage
    local-base-url: http://localhost:8080

server:
  port: 8080

  # /api/no_go 가 2,135건을 한 번에 내려줘서 본문이 534KB다. 좌표 숫자만 반복되는 JSON이라
  # gzip 이 63KB(11.8%)까지 줄인다. 압축 없이 dong 필터로 잘라낸 것보다 전체 압축이 더 작다.
  # nginx 가 이미 gzip 중이면 백엔드가 보낸 걸 그대로 통과시킨다(이중 압축은 일어나지 않는다).
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,text/javascript
    min-response-size: 2KB

# Nginx가 /actuator/health 만 백엔드로 보낸다. health 외에는 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
# ============================================================
# local — 각자 로컬 MySQL. RDS에 붙지 않는다.
# ============================================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/firedispatch?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate    # Flyway가 스키마를 만들고 Hibernate는 검증만 한다
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

---
# ============================================================
# prod — 서버 컨테이너. 값은 전부 ~/deploy/backend.env 에서 주입된다.
#        깃에는 어떤 실제 값도 들어가지 않는다.
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      # t3.micro(램 1GB) + db.t4g.micro 기준. 늘리기 전에 RDS max_connections를 먼저 볼 것.
      maximum-pool-size: 10
      minimum-idle: 2
      # 기본값 30초를 그대로 두면 커넥션이 말라도 30초를 기다린 뒤에야 실패한다.
      # 3초로 줄여서 장애가 '느림'이 아니라 '에러'로 빨리 드러나게 한다.
      connection-timeout: 3000
      max-lifetime: 1740000   # RDS wait_timeout 보다 짧게

  jpa:
    hibernate:
      ddl-auto: validate    # 마이그레이션이 덜 돈 상태로 뜨는 걸 막는다
    open-in-view: false
    show-sql: false

logging:
  level:
    root: info
