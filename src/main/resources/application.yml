spring:
  application:
    name: golden-lane-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/firedispatch?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 50
      min-spare: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
app:
  external:
    fire-system-url: ${EXTERNAL_FIRE_SYSTEM_URL:mock}
  cors:
    allowed-origins:
      - https://fireroad.shop
      - http://localhost:3000

