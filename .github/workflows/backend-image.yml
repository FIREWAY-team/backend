name: backend-image

# main / develop 에 머지되면 테스트 -> 이미지 빌드(GHCR) -> 서버 배포까지 자동으로 간다.
# 배포는 SSM send-command로 EC2의 ~/deploy/deploy.sh 를 실행한다.
# SSH가 아니라 SSM인 이유: SSH는 집 IP로 제한돼 있어 Actions 러너가 못 들어온다.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # PR에서도 돈다 — 단, 아래 test 잡만 실행되고 이미지 push/배포는 하지 않는다.
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Dockerfile이 `./gradlew bootJar -x test`로 빌드하므로 이미지 빌드만으로는
  # 테스트가 통째로 건너뛰어진다. 그래서 테스트는 이 잡에서 따로 돌린다.
  #
  # 이 잡은 이제 게이트다. build-and-push가 `needs: test`로 물려 있어서
  # 테스트가 깨지면 이미지도 안 만들어지고 배포도 안 나간다.
  #
  # 승격 전에는 test가 빨간 X여도 배포가 그대로 나갔다.
  # 실제로 run 34443799596 / 34443407283 (2026-09-10, main)에서
  # test: failure 인데 deploy: success 로 운영에 올라갔다.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  build-and-push:
    # 테스트가 통과해야만 이미지를 만든다. deploy는 build-and-push에 물려 있으므로
    # test -> build-and-push -> deploy 가 한 줄로 이어진다.
    needs: test
    # PR에서는 이미지를 올리지 않는다. main/develop 푸시에서만 돈다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fireway-team/backend:latest
            ghcr.io/fireway-team/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136022486319:role/fire-dispatch-gha-deploy
          aws-region: ap-northeast-2

      - name: SSM으로 서버에서 pull & 재기동
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-0a21fc6612d33c27a \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["su - ubuntu -c /home/ubuntu/deploy/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a \
            --query Status --output text)
          [ "$STATUS" = "Success" ] || exit 1
