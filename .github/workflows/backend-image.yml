name: backend-image

# main / develop 에 머지되면 이미지를 만들어 GHCR에 올린다.
# 서버 배포는 아직 수동이다 (SSH가 집 IP로 제한돼 있어서).
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fireway-team/backend:latest
            ghcr.io/fireway-team/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: OIDC 클레임 덤프 (디버그)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json;p=sys.stdin.read().strip();p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ('iss','aud','sub','repository','repository_owner')},indent=2))"

      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136022486319:role/fire-dispatch-gha-deploy
          aws-region: ap-northeast-2

      - name: SSM으로 서버에서 pull & 재기동
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-0a21fc6612d33c27a \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["su - ubuntu -c /home/ubuntu/deploy/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-0a21fc6612d33c27a \
            --query Status --output text)
          [ "$STATUS" = "Success" ] || exit 1
