name: backend-image

# main / develop 에 머지되면 이미지를 만들어 GHCR에 올린다.
# 서버 배포는 아직 수동이다 (SSH가 집 IP로 제한돼 있어서).
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fireway-team/backend:latest
            ghcr.io/fireway-team/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
