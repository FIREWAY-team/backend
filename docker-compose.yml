services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: firedispatch
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/firedispatch?serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_PROFILES_ACTIVE: local
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  mysql_data:

