services:
  postgis:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: goldenlane
      POSTGRES_USER: goldenlane
      POSTGRES_PASSWORD: goldenlane
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenlane -d goldenlane"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://goldenlane:goldenlane@postgis:5432/goldenlane
      ENV: development
      LOG_LEVEL: INFO
      EXTERNAL_FIRE_SYSTEM_URL: http://mock-fire-system:8080
    ports: ["8000:8000"]
    depends_on:
      postgis:
        condition: service_healthy

